<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Reset password - EduOS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23153c39'/><rect x='6' y='15' width='5' height='10' rx='2.5' fill='%23f36648'/><rect x='13.5' y='7' width='5' height='18' rx='2.5' fill='%23f36648'/><rect x='21' y='11' width='5' height='14' rx='2.5' fill='%23f36648'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/auth.css" />
  </head>
  <body>
    <div class="top"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>edu<span>OS</span></a></div>

    <main class="shell">
      <div class="card narrow">
        <section class="form-side">
          <div id="form-view">
            <p class="eyebrow">ALMOST DONE</p>
            <h2>Choose a new password</h2>
            <p class="sub">Minimum 8 characters.</p>

            <div id="alert" class="alert error"></div>

            <form id="reset-form" novalidate>
              <label for="password">New password</label>
              <input id="password" type="password" minlength="8" required autocomplete="new-password" />
              <br /><br />
              <label for="confirm">Confirm password</label>
              <input id="confirm" type="password" minlength="8" required autocomplete="new-password" />
              <br />
              <button class="button" type="submit" id="submit-btn">Update password</button>
            </form>
          </div>

          <div id="success-view" class="success-wrap">
            <div class="success-icon">✓</div>
            <h2>Password updated!</h2>
            <p>Your password has been changed and all other sessions were logged out.</p>
            <p class="alt" style="margin-top:14px"><a href="/login">Log in with your new password →</a></p>
          </div>
        </section>
      </div>
    </main>

    <footer class="mini">© 2026 EduOS · Learning, beautifully connected.</footer>

    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('reset-form');
      const alertBox = document.getElementById('alert');
      const btn = document.getElementById('submit-btn');

      if (!token) {
        form.style.display = 'none';
        alertBox.textContent = 'No reset token found in this link.';
        alertBox.classList.add('show');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.remove('show');
        const pw = document.getElementById('password').value;
        if (pw !== document.getElementById('confirm').value) {
          alertBox.textContent = 'Passwords do not match.';
          alertBox.classList.add('show');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Updating…';
        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: pw }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');
          document.getElementById('form-view').style.display = 'none';
          document.getElementById('success-view').classList.add('show');
        } catch (err) {
          alertBox.textContent = err.message;
          alertBox.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Update password';
        }
      });
    </script>
  </body>
</html>
