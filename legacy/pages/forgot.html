<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Forgot password - EduOS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23153c39'/><rect x='6' y='15' width='5' height='10' rx='2.5' fill='%23f36648'/><rect x='13.5' y='7' width='5' height='18' rx='2.5' fill='%23f36648'/><rect x='21' y='11' width='5' height='14' rx='2.5' fill='%23f36648'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/auth.css" />
  </head>
  <body>
    <div class="top"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span>edu<span>OS</span></a></div>

    <main class="shell">
      <div class="card narrow">
        <section class="form-side">
          <div id="form-view">
            <p class="eyebrow">PASSWORD HELP</p>
            <h2>Forgot your password?</h2>
            <p class="sub">Enter the email on your account and we'll send you a reset link.</p>

            <div id="alert" class="alert error"></div>

            <form id="forgot-form" novalidate>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@school.com" required autocomplete="email" />
              <br />
              <button class="button" type="submit" id="submit-btn">Send reset link</button>
            </form>
            <p class="alt"><a href="/login">Back to log in</a></p>
          </div>

          <div id="success-view" class="success-wrap">
            <div class="success-icon">✉</div>
            <h2>Check your email</h2>
            <p>If that email exists, a reset link is on its way. It expires in 1 hour.</p>
            <p class="alt" style="margin-top:14px"><a href="/login">Back to log in</a></p>
          </div>
        </section>
      </div>
    </main>

    <footer class="mini">© 2026 EduOS · Learning, beautifully connected.</footer>

    <script>
      const form = document.getElementById('forgot-form');
      const alertBox = document.getElementById('alert');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try {
          await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value }),
          });
          document.getElementById('form-view').style.display = 'none';
          document.getElementById('success-view').classList.add('show');
        } catch {
          alertBox.textContent = 'Something went wrong. Please try again.';
          alertBox.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        }
      });
    </script>
  </body>
</html>
